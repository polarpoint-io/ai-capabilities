name: Release

on:
  push:
    branches: [main]
    paths:
      - 'packages/agentsmd-validator/**'
      - '.releaserc.json'
      - '.github/workflows/release.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write   # required for npm trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No registry-url here — semantic-release writes its own .npmrc
          # Setting registry-url causes a NODE_AUTH_TOKEN/.npmrc conflict

      # npm trusted publishing (OIDC) requires npm CLI >= 11.5.1. Node 20's
      # bundled npm (10.x) predates that, so it must be upgraded explicitly
      # before semantic-release/npm tries to authenticate.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/npm

      # Publishing uses npm Trusted Publishing (OIDC) via the id-token: write
      # permission above — no NPM_TOKEN needed. Configure the trusted
      # publisher for this workflow at:
      # https://www.npmjs.com/package/agentsmd-validator/access
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
